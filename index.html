<!doctype html>
<html lang="km">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sincere Heart Distribution | SHD</title>
<meta name="description" content="Sincere Heart Distribution (SHD) — Warehousing, distribution and fleet logistics in Cambodia.">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
  :root{
    --navy:#0f2a47; --navy-2:#173a5e; --accent:#e4572e; --accent-2:#ff7a50;
    --bg:#f6f8fb; --card:#ffffff; --text:#1d2733; --muted:#5b6b7c; --line:#e2e8f0;
    --radius:14px; --max:1140px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{font-family:"Inter","Noto Sans Khmer",system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.7}
  body.km{font-family:"Noto Sans Khmer","Inter",system-ui,sans-serif}
  a{color:inherit;text-decoration:none}
  .wrap{max-width:var(--max);margin:0 auto;padding:0 20px}

  /* Header */
  header{position:sticky;top:0;z-index:50;background:rgba(15,42,71,.97);backdrop-filter:blur(6px)}
  .nav{display:flex;align-items:center;justify-content:space-between;height:68px}
  .logo{display:flex;align-items:center;gap:10px;color:#fff;font-weight:800;font-size:1.15rem}
  .logo-mark{width:38px;height:38px;border-radius:10px;background:var(--accent);display:grid;place-items:center}
  .logo-mark svg{width:22px;height:22px}
  .menu{display:flex;gap:26px;align-items:center}
  .menu a{color:#cfdbe8;font-size:.95rem;font-weight:600}
  .menu a:hover{color:#fff}
  .lang{border:1px solid #5f7c99;color:#fff;background:transparent;border-radius:999px;padding:6px 14px;font-weight:600;cursor:pointer;font-family:inherit}
  .lang:hover{background:var(--navy-2)}
  .burger{display:none;background:none;border:0;color:#fff;cursor:pointer}
  @media (max-width:820px){
    .menu{display:none;position:absolute;top:68px;left:0;right:0;background:var(--navy);flex-direction:column;padding:18px 20px;gap:14px;align-items:flex-start}
    .menu.open{display:flex}
    .burger{display:block}
  }

  /* Hero */
  .hero{background:linear-gradient(135deg,var(--navy) 0%,var(--navy-2) 60%,#23507c 100%);color:#fff;padding:96px 0 110px;position:relative;overflow:hidden}
  .hero::after{content:"";position:absolute;right:-120px;bottom:-120px;width:420px;height:420px;border-radius:50%;background:radial-gradient(circle,rgba(228,87,46,.35),transparent 70%)}
  .hero h1{font-size:clamp(2rem,4.6vw,3.3rem);line-height:1.25;max-width:760px;font-weight:800}
  .hero p{margin-top:18px;max-width:620px;color:#c9d6e4;font-size:1.1rem}
  .cta{display:flex;gap:14px;margin-top:34px;flex-wrap:wrap}
  .btn{display:inline-block;padding:13px 26px;border-radius:10px;font-weight:700;transition:.2s}
  .btn-primary{background:var(--accent);color:#fff}
  .btn-primary:hover{background:var(--accent-2)}
  .btn-ghost{border:1.5px solid #8aa3bd;color:#fff}
  .btn-ghost:hover{background:rgba(255,255,255,.08)}

  /* Sections */
  section{padding:84px 0}
  .eyebrow{color:var(--accent);font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:.85rem}
  h2{font-size:clamp(1.6rem,3vw,2.2rem);margin:8px 0 14px;color:var(--navy);line-height:1.35}
  .lead{color:var(--muted);max-width:680px}
  .grid{display:grid;gap:22px;margin-top:40px}
  .g4{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
  .g3{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:28px;transition:.2s}
  .card:hover{transform:translateY(-4px);box-shadow:0 12px 30px rgba(15,42,71,.08)}
  .icon{width:50px;height:50px;border-radius:12px;background:#fdeee9;display:grid;place-items:center;margin-bottom:16px}
  .icon svg{width:26px;height:26px;stroke:var(--accent)}
  .card h3{color:var(--navy);font-size:1.15rem;margin-bottom:6px}
  .card p{color:var(--muted);font-size:.96rem}

  /* About */
  .about{background:#fff}
  .about-grid{display:grid;grid-template-columns:1.1fr 1fr;gap:50px;align-items:center}
  @media (max-width:820px){.about-grid{grid-template-columns:1fr}}
  .checks{list-style:none;margin-top:22px;display:grid;gap:12px}
  .checks li{display:flex;gap:10px;align-items:flex-start}
  .checks li::before{content:"✓";color:#fff;background:var(--accent);border-radius:50%;min-width:22px;height:22px;display:grid;place-items:center;font-size:.8rem;margin-top:4px}
  .panel{background:linear-gradient(135deg,var(--navy),var(--navy-2));border-radius:18px;color:#fff;padding:36px}
  .panel h3{font-size:1.3rem;margin-bottom:18px}
  .panel .row{display:flex;justify-content:space-between;border-bottom:1px solid rgba(255,255,255,.15);padding:12px 0;gap:12px}
  .panel .row:last-child{border:0}
  .panel .row span:last-child{color:#ffb49c;font-weight:700;text-align:right}

  /* Process */
  .steps{counter-reset:s}
  .step{position:relative;padding-top:56px}
  .step::before{counter-increment:s;content:counter(s);position:absolute;top:22px;left:28px;width:40px;height:40px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:800}
  .step h3{margin-top:14px}

  /* Contact */
  .contact{background:var(--navy);color:#fff}
  .contact h2{color:#fff}
  .contact .lead{color:#b9c9da}
  .contact-grid{display:grid;grid-template-columns:1fr 1.2fr;gap:40px;margin-top:36px}
  @media (max-width:820px){.contact-grid{grid-template-columns:1fr}}
  .info div{display:flex;gap:12px;margin-bottom:18px;align-items:flex-start}
  .info svg{width:22px;height:22px;stroke:var(--accent-2);flex-shrink:0;margin-top:4px}
  form{background:#fff;border-radius:var(--radius);padding:28px;color:var(--text);display:grid;gap:14px}
  label{font-weight:600;font-size:.9rem}
  input,textarea,select{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:8px;font:inherit;margin-top:4px}
  textarea{min-height:110px;resize:vertical}
  form .btn{border:0;cursor:pointer;font:inherit;font-weight:700}
  .note{font-size:.85rem;color:var(--muted)}

  footer{background:#0a1e33;color:#8ea3b8;padding:26px 0;font-size:.9rem;text-align:center}
</style>
</head>

let lang = "km";
function apply(){
  document.documentElement.lang = lang;
  document.body.classList.toggle("km", lang === "km");
  document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = T[lang][el.dataset.i18n] || ""; });
  document.getElementById("langBtn").textContent = lang === "km" ? "EN" : "ខ្មែរ";
}
document.getElementById("langBtn").onclick = () => { lang = lang === "km" ? "en" : "km"; apply(); };
document.getElementById("burger").onclick = () => document.getElementById("menu").classList.toggle("open");
document.querySelectorAll(".menu a").forEach(a => a.onclick = () => document.getElementById("menu").classList.remove("open"));
document.getElementById("quoteForm").onsubmit = e => { e.preventDefault(); document.getElementById("formNote").textContent = T[lang].f_ok; e.target.reset(); };
document.getElementById("yr").textContent = new Date().getFullYear();
apply();
